<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr las GAMES - Panel Cyber RGB</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #050811;
            --bg-card: #0d1322;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --input-bg: #070a14;
        }

        /* ANIMATION DE DÉGRADÉ RGB */
        @keyframes rgbGlow {
            0% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
            33% { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
            66% { border-color: #7000ff; box-shadow: 0 0 15px rgba(112, 0, 255, 0.4); }
            100% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        }

        @keyframes textRgb {
            0% { color: #ff007f; }
            33% { color: #00f0ff; }
            66% { color: #7000ff; }
            100% { color: #ff007f; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #00f0ff); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px #ff007f); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px #00f0ff); }
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; /* Espace pour la barre de nav inférieure */
        }

        .text-rgb {
            animation: textRgb 6s infinite linear;
            font-weight: 800;
        }

        .card-rgb {
            background-color: var(--bg-card);
            border: 2px solid #00f0ff;
            border-radius: 20px;
            animation: rgbGlow 8s infinite linear;
            backdrop-filter: blur(10px);
        }

        /* ANIMATION INTERACTIVE DE CONNEXION */
        .login-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-card:focus-within {
            transform: scale(1.02);
        }

        .animated-icon {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        /* INPUTS STYLE CYBER */
        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            border: 1px solid #1e293b !important;
            color: #ffffff !important;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #00f0ff !important;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5) !important;
            transform: translateY(-2px);
        }

        /* BOUTON NEON RGB */
        .btn-rgb {
            background: linear-gradient(45deg, #ff007f, #7000ff, #00f0ff);
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
            color: #ffffff;
            border: none;
            font-weight: 700;
            border-radius: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-rgb:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* BARRE DE DÉFILEMENT HORIZONTAL HIDE/CUSTOM */
        .horizontal-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .horizontal-scroll-container::-webkit-scrollbar {
            height: 6px;
        }

        .horizontal-scroll-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
        }

        .horizontal-scroll-container::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 10px;
        }

        /* CARTE DE JEU DANS SECTION HORIZONTALE */
        .game-item-card {
            flex: 0 0 160px;
            background: rgba(7, 10, 20, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .game-item-card:hover {
            border-color: #00f0ff;
            transform: translateY(-3px);
        }

        .game-item-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #1e293b;
            margin-bottom: 8px;
        }

        .game-item-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .game-item-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .game-item-delete {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }


        .game-item-edit {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .game-item-card.editing {
            border-color: #ffc107;
            box-shadow: 0 0 0 1px #ffc107;
        }

        /* BARRE DE NAVIGATION INFÉRIEURE MOBILE/DESKTOP (BOTTOM NAV) */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: rgba(13, 19, 34, 0.95);
            border-top: 2px solid #00f0ff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5);
        }

        .bottom-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
        }

        .bottom-nav-btn i {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .bottom-nav-btn.active {
            color: #00f0ff;
            transform: translateY(-4px);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .notification-badge-rgb {
            position: absolute;
            top: -5px;
            right: 15px;
            background: #ff007f;
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 50px;
            box-shadow: 0 0 8px #ff007f;
        }

        /* VUE DASHBOARD ANIMÉE */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- LOGIN SECTION AVEC ANIMATIONS INTERACTIVES -->
    <div id="loginSection" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card-rgb login-card p-4 p-sm-5" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-gamepad animated-icon text-rgb fa-4x mb-3"></i>
                <h3 class="fw-bold text-white mb-1">Dr las <span class="text-rgb">GAMES</span></h3>
                <p class="text-muted small">Panel de contrôle RGB V6</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-white">Adresse Email Admin</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="loginEmail" class="form-control" placeholder="admin@drlasgames.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-white">Mot de passe secret</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div id="loginError" class="alert alert-danger p-2 small d-none" role="alert"></div>
                <button type="submit" id="loginBtn" class="btn btn-rgb w-100 py-3 mt-2">
                    <i class="fa-solid fa-bolt me-2"></i>ACCÉDER AU PANEL
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL RGB -->
    <div id="dashboardSection" class="d-none fade-in-up">
        
        <!-- HEADER EN-TÊTE -->
        <nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3 mb-4 sticky-top shadow-lg">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-rgb fa-lg"></i>
                    <span class="text-white">Panel <span class="text-rgb">Cyber RGB</span></span>
                </span>
                <div class="d-flex align-items-center gap-2">
                    <a href="index.html" target="_blank" class="btn btn-outline-info btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-eye me-1"></i> Voir le Store
                    </a>
                    <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-power-off me-1"></i> Quitter
                    </button>
                </div>
            </div>
        </nav>

        <div class="container">
            
            <!-- CONTENU TABS -->
            <div class="tab-content" id="cyberTabsContent">
                
                <!-- TAB 1 : GESTION ET AJOUT DE JEUX -->
                <div class="tab-pane fade show active" id="tabGamesView">
                    <div class="row g-4">
                        
                        <!-- FORMULAIRE AJOUT JEU -->
                        <div class="col-lg-5">
                            <div class="card-rgb p-4">
                                <h5 class="fw-bold mb-3 text-white" id="formTitle"><i class="fa-solid fa-plus-circle text-info me-2"></i>Publier un Jeu</h5>
                                <div id="editBanner" class="alert alert-warning py-2 small d-none mb-3"></div>
                                
                                <form id="addGameForm">
                                    <div class="mb-3">
                                        <label class="form-label small">Titre du Jeu</label>
                                        <input type="text" id="gameTitle" class="form-control" placeholder="Ex: God of War Ghost of Sparta" required>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-12 col-sm-6 mb-2 mb-sm-0">
                                            <label class="form-label small">Plateforme</label>
                                            <select id="gamePlatform" class="form-select" required>
                                                <option value="Android">Android</option>
                                                <option value="PC">PC</option>
                                                <option value="PSP" selected>PSP</option>
                                                <option value="PS2">PS2</option>
                                                <option value="GameHub">GameHub</option>
                                                <option value="Switch">Switch</option>
                                                <option value="PS3">PS3</option>
                                                <option value="PS4">PS4</option>
                                                <option value="PS Vita">PS Vita</option>
                                                <option value="3DS">3DS</option>
                                                <option value="Wii">Wii</option>
                                                <option value="GameCube">GameCube</option>
                                                <option value="custom">+ Autre section</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label small">Taille</label>
                                            <input type="text" id="gameSize" class="form-control" placeholder="Ex: 1,1 Go" required>
                                        </div>
                                    </div>

                                    <div class="mb-3 d-none" id="customPlatformContainer">
                                        <label class="form-label small text-warning"><i class="fa-solid fa-folder-plus me-1"></i> Nouvelle section</label>
                                        <input type="text" id="customPlatformInput" class="form-control" placeholder="Ex: PS5, Xbox...">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small">Pochette / Image (URL)</label>
                                        <input type="url" id="gameImage" class="form-control" placeholder="https://..." required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small d-flex justify-content-between align-items-center">
                                            <span>Liens de téléchargement</span>
                                            <button type="button" id="addMoreLinksBtn" class="btn btn-sm btn-outline-info py-0 rounded-pill"><i class="fa-solid fa-plus"></i> Lien miroir</button>
                                        </label>
                                        <div id="downloadLinksList"></div>
                                        <datalist id="linkNameSuggestions">
                                            <option value="Télécharger le jeu"></option>
                                            <option value="Télécharger (Mediafire)"></option>
                                            <option value="Télécharger (Mega)"></option>
                                            <option value="Télécharger (Google Drive)"></option>
                                            <option value="Miroir 2"></option>
                                            <option value="Lien alternatif"></option>
                                        </datalist>
                                        <div class="form-text small" style="color: var(--text-muted);">Nom du bouton affiché sur le store. Vide = « Télécharger le jeu ».</div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small">Vidéo Gameplay (URL YouTube)</label>
                                        <input type="text" id="gameYoutube" class="form-control" placeholder="https://youtu.be/...">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small">Description du Jeu</label>
                                        <textarea id="gameDescription" class="form-control" rows="3" placeholder="Présentation du jeu..."></textarea>
                                    </div>

                                    <button type="submit" id="submitGameBtn" class="btn btn-rgb w-100 py-3 mt-2">
                                        <i class="fa-solid fa-rocket me-2"></i>PUBLIER SUR LE STORE
                                    </button>
                                    <button type="button" id="cancelEditBtn" class="btn btn-outline-secondary w-100 mt-2 d-none">
                                        <i class="fa-solid fa-xmark me-2"></i>Annuler la modification
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- LISTE DES JEUX PUBLIÉS (TRIÉS PAR SECTIONS AVEC DÉFILEMENT HORIZONTAL) -->
                        <div class="col-lg-7">
                            <div class="card-rgb p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="fw-bold m-0 text-white"><i class="fa-solid fa-list text-info me-2"></i>Catalogue en Ligne</h5>
                                    <span class="badge bg-info text-dark fw-bold rounded-pill px-3" id="gameCount">0 jeu</span>
                                </div>

                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                                    <input type="search" id="adminSearch" class="form-control" placeholder="Rechercher un jeu du catalogue...">
                                </div>

                                <div id="adminGamesContainer">
                                    <p class="text-center text-muted py-4">Chargement...</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- TAB 2 : MODÉRATION CHAT & AVIS -->
                <div class="tab-pane fade" id="tabChatView">
                    <div class="card-rgb p-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <h5 class="fw-bold m-0 text-white"><i class="fa-solid fa-comments text-info me-2"></i>Avis et Commentaires Utilisateurs</h5>
                            <div class="btn-group btn-group-sm" role="group">
                                <button type="button" id="filterUnreadBtn" class="btn btn-outline-warning active rounded-start-pill">
                                    <i class="fa-solid fa-bell me-1"></i> Non lus
                                </button>
                                <button type="button" id="filterAllBtn" class="btn btn-outline-secondary rounded-end-pill">
                                    <i class="fa-solid fa-list me-1"></i> Tous
                                </button>
                            </div>
                        </div>

                        <div id="adminChatContainer">
                            <p class="text-center text-muted py-4">Chargement des avis...</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- BARRE DE NAVIGATION INFÉRIEURE (BOTTOM NAV BAR) -->
    <div id="bottomNavBar" class="bottom-nav-bar d-none">
        <button id="navGamesBtn" class="bottom-nav-btn active" onclick="switchTab('games')">
            <i class="fa-solid fa-gamepad"></i>
            <span>Jeux</span>
        </button>
        <button id="navChatBtn" class="bottom-nav-btn" onclick="switchTab('chat')">
            <i class="fa-solid fa-comments"></i>
            <span>Avis & Chat</span>
            <span id="unreadBadgeNav" class="notification-badge-rgb d-none">0</span>
        </button>
    </div>

    <!-- LOGIQUE JAVASCRIPT ET FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqYr_bxu0ZmO8_8-p9pHLdB_F0Nye2cXA",
            authDomain: "dr-las.firebaseapp.com",
            projectId: "dr-las",
            storageBucket: "dr-las.firebasestorage.app",
            messagingSenderId: "885667568341",
            appId: "1:885667568341:web:e6b9733cb0456a3f02a05c",
            measurementId: "G-M7JH2GRT8K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const bottomNavBar = document.getElementById('bottomNavBar');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const addGameForm = document.getElementById('addGameForm');
        const adminGamesContainer = document.getElementById('adminGamesContainer');
        const gameCount = document.getElementById('gameCount');

        const gamePlatformSelect = document.getElementById('gamePlatform');
        const customPlatformContainer = document.getElementById('customPlatformContainer');
        const customPlatformInput = document.getElementById('customPlatformInput');

        let currentChatFilter = 'unread';
        let cachedComments = [];

        // BASE DE NAVIGATION
        window.switchTab = function(tabName) {
            const gamesView = document.getElementById('tabGamesView');
            const chatView = document.getElementById('tabChatView');
            const navGamesBtn = document.getElementById('navGamesBtn');
            const navChatBtn = document.getElementById('navChatBtn');

            if (tabName === 'games') {
                gamesView.classList.add('show', 'active');
                chatView.classList.remove('show', 'active');
                navGamesBtn.classList.add('active');
                navChatBtn.classList.remove('active');
            } else {
                chatView.classList.add('show', 'active');
                gamesView.classList.remove('show', 'active');
                navChatBtn.classList.add('active');
                navGamesBtn.classList.remove('active');
            }
        };

        // GESTION DES LIENS / MIROIRS DE TÉLÉCHARGEMENT
        const linksContainer = document.getElementById('downloadLinksList');

        function escAttr(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function createLinkRow(label, url) {
            const div = document.createElement('div');
            div.className = 'input-group mb-2 link-row';
            div.innerHTML = `
                <input type="text" class="form-control link-name" list="linkNameSuggestions" placeholder="Télécharger le jeu" value="${escAttr(label)}">
                <input type="url" class="form-control link-url" placeholder="https://..." value="${escAttr(url)}" required>
                <button type="button" class="btn btn-outline-danger remove-link-btn" title="Supprimer ce lien"><i class="fa-solid fa-times"></i></button>
            `;
            div.querySelector('.remove-link-btn').addEventListener('click', () => {
                if (linksContainer.querySelectorAll('.link-row').length > 1) {
                    div.remove();
                } else {
                    div.querySelector('.link-name').value = '';
                    div.querySelector('.link-url').value = '';
                }
            });
            return div;
        }

        // Remplit la liste avec les liens donnés (ou une ligne vide)
        function setLinkRows(links) {
            linksContainer.innerHTML = '';
            if (!links || links.length === 0) links = [{ label: '', url: '' }];
            links.forEach(l => linksContainer.appendChild(createLinkRow(l.label, l.url)));
        }

        document.getElementById('addMoreLinksBtn').addEventListener('click', () => {
            const n = linksContainer.querySelectorAll('.link-row').length + 1;
            linksContainer.appendChild(createLinkRow('Miroir ' + n, ''));
        });

        setLinkRows([]);

        gamePlatformSelect.addEventListener('change', () => {
            if (gamePlatformSelect.value === 'custom') {
                customPlatformContainer.classList.remove('d-none');
                customPlatformInput.setAttribute('required', 'required');
            } else {
                customPlatformContainer.classList.add('d-none');
                customPlatformInput.removeAttribute('required');
            }
        });

        // AUTHENTIFICATION
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('d-none');
                dashboardSection.classList.remove('d-none');
                bottomNavBar.classList.remove('d-none');
                loadAdminGames();
                loadAdminChat();
            } else {
                dashboardSection.classList.add('d-none');
                bottomNavBar.classList.add('d-none');
                loginSection.classList.remove('d-none');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            loginError.classList.add('d-none');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = "Email ou mot de passe invalide.";
                loginError.classList.remove('d-none');
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        function extractYoutubeId(urlOrId) {
            if (!urlOrId) return "";
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId.trim();
        }

        // PUBLICATION / MODIFICATION DU JEU
        const PLATFORM_ORDER = ['android', 'pc', 'psp', 'ps2', 'gamehub', 'switch', 'ps3', 'ps4'];
        const platformRank = (p) => {
            const i = PLATFORM_ORDER.indexOf(String(p).toLowerCase());
            return i === -1 ? PLATFORM_ORDER.length : i;
        };

        const formTitleEl = document.getElementById('formTitle');
        const editBanner = document.getElementById('editBanner');
        const submitGameBtn = document.getElementById('submitGameBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const adminSearch = document.getElementById('adminSearch');

        let editingId = null;
        let gamesCache = [];
        let searchTerm = '';

        function resetGameForm() {
            addGameForm.reset();
            editingId = null;
            setLinkRows([]);
            customPlatformContainer.classList.add('d-none');
            customPlatformInput.removeAttribute('required');
            formTitleEl.innerHTML = '<i class="fa-solid fa-plus-circle text-info me-2"></i>Publier un Jeu';
            submitGameBtn.innerHTML = '<i class="fa-solid fa-rocket me-2"></i>PUBLIER SUR LE STORE';
            editBanner.classList.add('d-none');
            cancelEditBtn.classList.add('d-none');
            renderAdminGames();
        }

        function startEdit(id) {
            const game = gamesCache.find(g => g.id === id);
            if (!game) return;
            editingId = id;

            document.getElementById('gameTitle').value = game.title || '';
            document.getElementById('gameSize').value = game.size || '';
            document.getElementById('gameImage').value = game.imageUrl || '';
            document.getElementById('gameYoutube').value = game.youtubeId || '';
            document.getElementById('gameDescription').value = game.description || '';

            const plat = game.platform || game.category || 'PSP';
            const known = Array.from(gamePlatformSelect.options).some(o => o.value === plat && o.value !== 'custom');
            if (known) {
                gamePlatformSelect.value = plat;
                customPlatformContainer.classList.add('d-none');
                customPlatformInput.removeAttribute('required');
            } else {
                gamePlatformSelect.value = 'custom';
                customPlatformContainer.classList.remove('d-none');
                customPlatformInput.setAttribute('required', 'required');
                customPlatformInput.value = plat;
            }

            // Les liens déjà en ligne sont rechargés dans le formulaire
            let links = Array.isArray(game.downloadLinks) ? game.downloadLinks.filter(l => l && l.url) : [];
            if (links.length === 0 && game.downloadUrl) links = [{ label: '', url: game.downloadUrl }];
            setLinkRows(links);

            formTitleEl.innerHTML = '<i class="fa-solid fa-pen-to-square text-warning me-2"></i>Modifier le Jeu';
            submitGameBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i>METTRE À JOUR LE JEU';
            editBanner.textContent = 'Modification de : ' + (game.title || '') + ' — tes liens sont conservés, modifie-les ou supprime-les.';
            editBanner.classList.remove('d-none');
            cancelEditBtn.classList.remove('d-none');
            renderAdminGames();
            formTitleEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        cancelEditBtn.addEventListener('click', resetGameForm);

        addGameForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('gameTitle').value.trim();
            let platform = gamePlatformSelect.value;
            if (platform === 'custom') platform = customPlatformInput.value.trim();

            const size = document.getElementById('gameSize').value.trim();
            const imageUrl = document.getElementById('gameImage').value.trim();
            const description = document.getElementById('gameDescription').value.trim();
            const youtubeId = extractYoutubeId(document.getElementById('gameYoutube').value.trim());

            const downloadLinks = [];
            document.querySelectorAll('#downloadLinksList .link-row').forEach(row => {
                const label = row.querySelector('.link-name').value.trim();
                const url = row.querySelector('.link-url').value.trim();
                if (url) downloadLinks.push({ label: label || 'Télécharger le Jeu', url: url });
            });

            const data = {
                title,
                platform,
                category: platform,
                size,
                imageUrl,
                downloadUrl: downloadLinks.length > 0 ? downloadLinks[0].url : "",
                downloadLinks,
                youtubeId,
                description
            };

            submitGameBtn.disabled = true;
            try {
                if (editingId) {
                    await updateDoc(doc(db, "games", editingId), data);
                    resetGameForm();
                    alert("Jeu mis à jour !");
                } else {
                    await addDoc(collection(db, "games"), {
                        ...data,
                        likes: 0,
                        rating: "4.8",
                        createdAt: serverTimestamp()
                    });
                    resetGameForm();
                    alert("Jeu publié avec succès sur le Store !");
                }
            } catch (error) {
                alert("Erreur : " + error.message);
            } finally {
                submitGameBtn.disabled = false;
            }
        });

        // RECHERCHE DANS LE CATALOGUE
        adminSearch.addEventListener('input', () => {
            searchTerm = adminSearch.value.trim().toLowerCase();
            renderAdminGames();
        });

        // AFFICHAGE DU CATALOGUE (SECTIONS + DÉFILEMENT HORIZONTAL)
        function renderAdminGames() {
            const total = gamesCache.length;
            adminGamesContainer.innerHTML = "";

            if (total === 0) {
                gameCount.textContent = "0 jeu(x)";
                adminGamesContainer.innerHTML = `<p class="text-center text-muted py-4">Aucun jeu disponible.</p>`;
                return;
            }

            const visible = searchTerm
                ? gamesCache.filter(g => (g.title || '').toLowerCase().includes(searchTerm))
                : gamesCache;

            gameCount.textContent = searchTerm ? `${visible.length} / ${total} jeu(x)` : `${total} jeu(x)`;

            if (visible.length === 0) {
                adminGamesContainer.innerHTML = `<p class="text-center text-muted py-4">Aucun jeu ne correspond à ta recherche.</p>`;
                return;
            }

            const gamesByPlatform = {};
            visible.forEach(game => {
                const plat = game.platform || game.category || "PSP";
                (gamesByPlatform[plat] = gamesByPlatform[plat] || []).push(game);
            });

            const platforms = Object.keys(gamesByPlatform)
                .sort((a, b) => platformRank(a) - platformRank(b) || a.localeCompare(b));

            platforms.forEach((platform) => {
                const gamesList = gamesByPlatform[platform];
                let sectionHtml = `
                    <div class="mb-4">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <h6 class="fw-bold text-info m-0">
                                <i class="fa-solid fa-gamepad me-1"></i> ${escAttr(platform)}
                                <span class="badge bg-dark border border-secondary text-muted ms-1">${gamesList.length}</span>
                            </h6>
                        </div>
                        <div class="horizontal-scroll-container">
                `;

                gamesList.forEach((game) => {
                    const nbLinks = Array.isArray(game.downloadLinks) ? game.downloadLinks.length : (game.downloadUrl ? 1 : 0);
                    sectionHtml += `
                        <div class="game-item-card ${game.id === editingId ? 'editing' : ''}">
                            <button class="btn btn-sm btn-warning rounded-circle edit-btn game-item-edit" data-id="${game.id}" title="Modifier">
                                <i class="fa-solid fa-pen fa-xs"></i>
                            </button>
                            <button class="btn btn-sm btn-danger rounded-circle delete-btn game-item-delete" data-id="${game.id}" title="Supprimer">
                                <i class="fa-solid fa-trash fa-xs"></i>
                            </button>
                            <img src="${escAttr(game.imageUrl || 'https://via.placeholder.com/150')}" class="game-item-img" alt="Cover" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="game-item-title" title="${escAttr(game.title)}">${escAttr(game.title)}</div>
                            <div class="game-item-size"><i class="fa-solid fa-hard-drive me-1"></i>${escAttr(game.size || 'N/A')} · <i class="fa-solid fa-link me-1"></i>${nbLinks}</div>
                        </div>
                    `;
                });

                sectionHtml += `
                        </div>
                    </div>
                `;
                adminGamesContainer.insertAdjacentHTML('beforeend', sectionHtml);
            });
        }

        // Clics Modifier / Supprimer (délégation, attachée une seule fois)
        adminGamesContainer.addEventListener('click', async (e) => {
            const editBtn = e.target.closest('.edit-btn');
            const delBtn = e.target.closest('.delete-btn');
            if (editBtn) {
                startEdit(editBtn.getAttribute('data-id'));
            } else if (delBtn) {
                const docId = delBtn.getAttribute('data-id');
                if (confirm("Supprimer ce jeu du Store ?")) {
                    await deleteDoc(doc(db, "games", docId));
                    if (docId === editingId) resetGameForm();
                }
            }
        });

        // CHARGEMENT JEUX
        function loadAdminGames() {
            onSnapshot(collection(db, "games"), (snapshot) => {
                gamesCache = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAdminGames();
            });
        }

        // CHARGEMENT CHAT & AVIS
        function loadAdminChat() {
            const reviewsRef = collection(db, "gameComments");
            onSnapshot(reviewsRef, (snapshot) => {
                cachedComments = [];
                let unreadCount = 0;

                snapshot.forEach(docSnap => {
                    const c = { id: docSnap.id, ...docSnap.data() };
                    cachedComments.push(c);

                    if (!c.readByAdmin && c.username !== "Admin (Dr las)") {
                        unreadCount++;
                    }
                });

                const badgeNav = document.getElementById('unreadBadgeNav');
                if (unreadCount > 0) {
                    badgeNav.textContent = unreadCount;
                    badgeNav.classList.remove('d-none');
                } else {
                    badgeNav.classList.add('d-none');
                }

                renderAdminChat();
            });
        }

        function renderAdminChat() {
            const container = document.getElementById('adminChatContainer');
            container.innerHTML = "";

            let displayComments = cachedComments;

            if (currentChatFilter === 'unread') {
                displayComments = cachedComments.filter(c => !c.readByAdmin && c.username !== "Admin (Dr las)");
            }

            if (displayComments.length === 0) {
                container.innerHTML = `<p class="text-center text-muted py-4">Aucun commentaire dans cette liste.</p>`;
                return;
            }

            displayComments.forEach(comm => {
                container.innerHTML += `
                    <div class="card bg-dark border-secondary p-3 mb-2 rounded-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="text-info"><i class="fa-solid fa-user me-1"></i>${comm.username || 'Joueur'}</strong>
                            <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="deleteCommentAdmin('${comm.id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <p class="mb-0 text-light small">${comm.text || comm.message}</p>
                    </div>
                `;
            });
        }

        window.deleteCommentAdmin = async function(commentId) {
            if (confirm("Supprimer cet avis ?")) {
                await deleteDoc(doc(db, "gameComments", commentId));
            }
        };
    </script>
</body>
</html>
