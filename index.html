<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr las GAMES - Panel Cyber RGB</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #050811;
            --bg-card: #0d1322;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --input-bg: #070a14;
        }

        /* ANIMATION DE DÉGRADÉ RGB */
        @keyframes rgbGlow {
            0% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
            33% { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
            66% { border-color: #7000ff; box-shadow: 0 0 15px rgba(112, 0, 255, 0.4); }
            100% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        }

        @keyframes textRgb {
            0% { color: #ff007f; }
            33% { color: #00f0ff; }
            66% { color: #7000ff; }
            100% { color: #ff007f; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #00f0ff); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px #ff007f); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px #00f0ff); }
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; /* Espace pour la barre de nav inférieure */
        }

        .text-rgb {
            animation: textRgb 6s infinite linear;
            font-weight: 800;
        }

        .card-rgb {
            background-color: var(--bg-card);
            border: 2px solid #00f0ff;
            border-radius: 20px;
            animation: rgbGlow 8s infinite linear;
            backdrop-filter: blur(10px);
        }

        /* ANIMATION INTERACTIVE DE CONNEXION */
        .login-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-card:focus-within {
            transform: scale(1.02);
        }

        .animated-icon {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        /* INPUTS STYLE CYBER */
        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            border: 1px solid #1e293b !important;
            color: #ffffff !important;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #00f0ff !important;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5) !important;
            transform: translateY(-2px);
        }

        /* BOUTON NEON RGB */
        .btn-rgb {
            background: linear-gradient(45deg, #ff007f, #7000ff, #00f0ff);
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
            color: #ffffff;
            border: none;
            font-weight: 700;
            border-radius: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-rgb:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* BARRE DE DÉFILEMENT HORIZONTAL HIDE/CUSTOM */
        .horizontal-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .horizontal-scroll-container::-webkit-scrollbar {
            height: 6px;
        }

        .horizontal-scroll-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
        }

        .horizontal-scroll-container::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 10px;
        }

        /* CARTE DE JEU DANS SECTION HORIZONTALE */
        .game-item-card {
            flex: 0 0 160px;
            background: rgba(7, 10, 20, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .game-item-card:hover {
            border-color: #00f0ff;
            transform: translateY(-3px);
        }

        .game-item-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #1e293b;
            margin-bottom: 8px;
        }

        .game-item-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .game-item-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .game-item-delete {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* BARRE DE NAVIGATION INFÉRIEURE MOBILE/DESKTOP (BOTTOM NAV) */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: rgba(13, 19, 34, 0.95);
            border-top: 2px solid #00f0ff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5);
        }

        .bottom-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
        }

        .bottom-nav-btn i {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .bottom-nav-btn.active {
            color: #00f0ff;
            transform: translateY(-4px);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .notification-badge-rgb {
            position: absolute;
            top: -5px;
            right: 15px;
            background: #ff007f;
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 50px;
            box-shadow: 0 0 8px #ff007f;
        }

        /* VUE DASHBOARD ANIMÉE */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- LOGIN SECTION AVEC ANIMATIONS INTERACTIVES -->
    <div id="loginSection" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card-rgb login-card p-4 p-sm-5" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-gamepad animated-icon text-rgb fa-4x mb-3"></i>
                <h3 class="fw-bold text-white mb-1">Dr las <span class="text-rgb">GAMES</span></h3>
                <p class="text-muted small">Panel de contrôle RGB V6</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-white">Adresse Email Admin</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="loginEmail" class="form-control" placeholder="admin@drlasgames.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-white">Mot de passe secret</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div id="loginError" class="alert alert-danger p-2 small d-none" role="alert"></div>
                <button type="submit" id="loginBtn" class="btn btn-rgb w-100 py-3 mt-2">
                    <i class="fa-solid fa-bolt me-2"></i>ACCÉDER AU PANEL
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL RGB -->
    <div id="dashboardSection" class="d-none fade-in-up">
        
        <!-- HEADER EN-TÊTE -->
        <nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3 mb-4 sticky-top shadow-lg">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-rgb fa-lg"></i>
                    <span class="text-white">Panel <span class="text-rgb">Cyber RGB</span></span>
                </span>
                <div class="d-flex align-items-center gap-2">
                    <a href="index.html" target="_blank" class="btn btn-outline-info btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-eye me-1"></i> Voir le Store
                    </a>
                    <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-power-off me-1"></i> Quitter
                    </button>
                </div>
            </div>
        </nav>

        <div class="container">
            
            <!-- CONTENU TABS -->
            <div class="tab-content" id="cyberTabsContent">
                
                <!-- TAB 1 : GESTION ET AJOUT DE JEUX -->
                <div class="tab-pane fade show active" id="tabGamesView">
                    <div class="row g-4">
                        
                        <!-- FORMULAIRE AJOUT JEU -->
                        <div class="col-lg-5">
                            <div class="card-rgb p-4">
                                <h5 class="fw-bold mb-3 text-white"><i class="fa-solid fa-plus-circle text-info me-2"></i>Publier un Jeu</h5>
                                
                                <form id="addGameForm">
                                    <div class="mb-3">
                                        <label class="form-label small">Titre du Jeu</label>
                                        <input type="text" id="gameTitle" class="form-control" placeholder="Ex: God of War Ghost of Sparta" required>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-12 col-sm-6 mb-2 mb-sm-0">
                                            <label class="form-label small">Plateforme</label>
                                            <select id="gamePlatform" class="form-select" required>
                                                <option value="PSP">PSP</option>
                                                <option value="PS2">PS2</option>
                                                <option value="PS Vita">PS Vita</option>
                                                <option value="PS3">PS3</option>
                                                <option value="Android">Android</option>
                                                <option value="PC">PC</option>
                                                <option value="Switch">Switch</option>
                                                <option value="3DS">3DS</option>
                                                <option value="Wii">Wii</option>
                                                <option value="GameCube">GameCube</option>
                                                <option value="custom">+ Autre section</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label small">Taille</label>
                                            <input type="text" id="gameSize" class="form-control" placeholder="Ex: 1,1 Go" required>
                                        </div>
                                    </div>

                                    <div class="mb-3 d-none" id="customPlatformContainer">
                                        <label class="form-label small text-warning"><i class="fa-solid fa-folder-plus me-1"></i> Nouvelle section</label>
                                        <input type="text" id="customPlatformInput" class="form-control" placeholder="Ex: PS5, Xbox...">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small">Pochette / Image (URL)</label>
                                        <input type="url" id="gameImage" class="form-control" placeholder="https://..." required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small d-flex justify-content-between align-items-center">
                                            <span>Liens de téléchargement</span>
                                            <button type="button" id="addMoreLinksBtn" class="btn btn-sm btn-outline-info py-0 rounded-pill"><i class="fa-solid fa-plus"></i> Lien miroir</button>
                                        </label>
                                        <div id="downloadLinksList">
                                            <div class="input-group mb-2 link-row">
                                                <input type="text" class="form-control link-name" placeholder="Nom du lien" value="Télécharger (Mediafire)">
                                                <input type="url" class="form-control link-url" placeholder="https://mediafire.com/file/..." required>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small">Vidéo Gameplay (URL YouTube)</label>
                                        <input type="text" id="gameYoutube" class="form-control" placeholder="https://youtu.be/...">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small">Description du Jeu</label>
                                        <textarea id="gameDescription" class="form-control" rows="3" placeholder="Présentation du jeu..."></textarea>
                                    </div>

                                    <button type="submit" id="submitGameBtn" class="btn btn-rgb w-100 py-3 mt-2">
                                        <i class="fa-solid fa-rocket me-2"></i>PUBLIER SUR LE STORE
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- LISTE DES JEUX PUBLIÉS (TRIÉS PAR SECTIONS AVEC DÉFILEMENT HORIZONTAL) -->
                        <div class="col-lg-7">
                            <div class="card-rgb p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="fw-bold m-0 text-white"><i class="fa-solid fa-list text-info me-2"></i>Catalogue en Ligne</h5>
                                    <span class="badge bg-info text-dark fw-bold rounded-pill px-3" id="gameCount">0 jeu</span>
                                </div>

                                <div id="adminGamesContainer">
                                    <p class="text-center text-muted py-4">Chargement...</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- TAB 2 : MODÉRATION CHAT & AVIS -->
                <div class="tab-pane fade" id="tabChatView">
                    <div class="card-rgb p-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <h5 class="fw-bold m-0 text-white"><i class="fa-solid fa-comments text-info me-2"></i>Avis et Commentaires Utilisateurs</h5>
                            <div class="btn-group btn-group-sm" role="group">
                                <button type="button" id="filterUnreadBtn" class="btn btn-outline-warning active rounded-start-pill">
                                    <i class="fa-solid fa-bell me-1"></i> Non lus
                                </button>
                                <button type="button" id="filterAllBtn" class="btn btn-outline-secondary rounded-end-pill">
                                    <i class="fa-solid fa-list me-1"></i> Tous
                                </button>
                            </div>
                        </div>

                        <div id="adminChatContainer">
                            <p class="text-center text-muted py-4">Chargement des avis...</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- BARRE DE NAVIGATION INFÉRIEURE (BOTTOM NAV BAR) -->
    <div id="bottomNavBar" class="bottom-nav-bar d-none">
        <button id="navGamesBtn" class="bottom-nav-btn active" onclick="switchTab('games')">
            <i class="fa-solid fa-gamepad"></i>
            <span>Jeux</span>
        </button>
        <button id="navChatBtn" class="bottom-nav-btn" onclick="switchTab('chat')">
            <i class="fa-solid fa-comments"></i>
            <span>Avis & Chat</span>
            <span id="unreadBadgeNav" class="notification-badge-rgb d-none">0</span>
        </button>
    </div>

    <!-- LOGIQUE JAVASCRIPT ET FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqYr_bxu0ZmO8_8-p9pHLdB_F0Nye2cXA",
            authDomain: "dr-las.firebaseapp.com",
            projectId: "dr-las",
            storageBucket: "dr-las.firebasestorage.app",
            messagingSenderId: "885667568341",
            appId: "1:885667568341:web:e6b9733cb0456a3f02a05c",
            measurementId: "G-M7JH2GRT8K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const bottomNavBar = document.getElementById('bottomNavBar');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const addGameForm = document.getElementById('addGameForm');
        const adminGamesContainer = document.getElementById('adminGamesContainer');
        const gameCount = document.getElementById('gameCount');

        const gamePlatformSelect = document.getElementById('gamePlatform');
        const customPlatformContainer = document.getElementById('customPlatformContainer');
        const customPlatformInput = document.getElementById('customPlatformInput');

        let currentChatFilter = 'unread';
        let cachedComments = [];

        // BASE DE NAVIGATION
        window.switchTab = function(tabName) {
            const gamesView = document.getElementById('tabGamesView');
            const chatView = document.getElementById('tabChatView');
            const navGamesBtn = document.getElementById('navGamesBtn');
            const navChatBtn = document.getElementById('navChatBtn');

            if (tabName === 'games') {
                gamesView.classList.add('show', 'active');
                chatView.classList.remove('show', 'active');
                navGamesBtn.classList.add('active');
                navChatBtn.classList.remove('active');
            } else {
                chatView.classList.add('show', 'active');
                gamesView.classList.remove('show', 'active');
                navChatBtn.classList.add('active');
                navGamesBtn.classList.remove('active');
            }
        };

        // GESTION DES MIROIRS TÉLÉCHARGEMENT
        document.getElementById('addMoreLinksBtn').addEventListener('click', () => {
            const container = document.getElementById('downloadLinksList');
            const rowCount = container.querySelectorAll('.link-row').length + 1;
            const div = document.createElement('div');
            div.className = 'input-group mb-2 link-row';
            div.innerHTML = `
                <input type="text" class="form-control link-name" placeholder="Nom" value="Miroir ${rowCount}">
                <input type="url" class="form-control link-url" placeholder="https://..." required>
                <button type="button" class="btn btn-outline-danger remove-link-btn"><i class="fa-solid fa-times"></i></button>
            `;
            container.appendChild(div);

            div.querySelector('.remove-link-btn').addEventListener('click', () => div.remove());
        });

        gamePlatformSelect.addEventListener('change', () => {
            if (gamePlatformSelect.value === 'custom') {
                customPlatformContainer.classList.remove('d-none');
                customPlatformInput.setAttribute('required', 'required');
            } else {
                customPlatformContainer.classList.add('d-none');
                customPlatformInput.removeAttribute('required');
            }
        });

        // AUTHENTIFICATION
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('d-none');
                dashboardSection.classList.remove('d-none');
                bottomNavBar.classList.remove('d-none');
                loadAdminGames();
                loadAdminChat();
            } else {
                dashboardSection.classList.add('d-none');
                bottomNavBar.classList.add('d-none');
                loginSection.classList.remove('d-none');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            loginError.classList.add('d-none');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = "Email ou mot de passe invalide.";
                loginError.classList.remove('d-none');
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        function extractYoutubeId(urlOrId) {
            if (!urlOrId) return "";
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId.trim();
        }

        // PUBLICATION DU JEU
        addGameForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('gameTitle').value;
            let platform = gamePlatformSelect.value;
            if (platform === 'custom') platform = customPlatformInput.value.trim();

            const size = document.getElementById('gameSize').value;
            const imageUrl = document.getElementById('gameImage').value;
            const description = document.getElementById('gameDescription').value.trim();
            const youtubeRaw = document.getElementById('gameYoutube').value.trim();
            const youtubeId = extractYoutubeId(youtubeRaw);

            const downloadLinks = [];
            const linkRows = document.querySelectorAll('.link-row');
            linkRows.forEach(row => {
                const label = row.querySelector('.link-name').value.trim();
                const url = row.querySelector('.link-url').value.trim();
                if (url) {
                    downloadLinks.push({ label: label || 'Télécharger le Jeu', url: url });
                }
            });

            const firstDownloadUrl = downloadLinks.length > 0 ? downloadLinks[0].url : "";

            try {
                await addDoc(collection(db, "games"), {
                    title,
                    platform,
                    category: platform,
                    size,
                    imageUrl,
                    downloadUrl: firstDownloadUrl,
                    downloadLinks: downloadLinks,
                    youtubeId: youtubeId,
                    description,
                    likes: 0,
                    rating: "4.8",
                    createdAt: serverTimestamp()
                });

                addGameForm.reset();
                document.getElementById('downloadLinksList').innerHTML = `
                    <div class="input-group mb-2 link-row">
                        <input type="text" class="form-control link-name" placeholder="Nom du lien" value="Télécharger (Mediafire)">
                        <input type="url" class="form-control link-url" placeholder="https://mediafire.com/file/..." required>
                    </div>
                `;
                customPlatformContainer.classList.add('d-none');
                alert("Jeu publié avec succès sur le Store !");
            } catch (error) {
                alert("Erreur de publication : " + error.message);
            }
        });

        // CHARGEMENT JEUX (REGROUPEMENT PAR SECTIONS AVEC DÉFILEMENT HORIZONTAL)
        function loadAdminGames() {
            const gamesRef = collection(db, "games");
            onSnapshot(gamesRef, (snapshot) => {
                adminGamesContainer.innerHTML = "";
                gameCount.textContent = `${snapshot.size} jeu(x)`;

                if (snapshot.empty) {
                    adminGamesContainer.innerHTML = `<p class="text-center text-muted py-4">Aucun jeu disponible.</p>`;
                    return;
                }

                // Regroupement des jeux par plateforme
                const gamesByPlatform = {};
                snapshot.forEach((gameDoc) => {
                    const game = gameDoc.data();
                    const id = gameDoc.id;
                    const plat = game.platform || game.category || "PSP";

                    if (!gamesByPlatform[plat]) {
                        gamesByPlatform[plat] = [];
                    }
                    gamesByPlatform[plat].push({ id, ...game });
                });

                // Génération HTML pour chaque section
                Object.keys(gamesByPlatform).forEach((platform) => {
                    const gamesList = gamesByPlatform[platform];
                    
                    let sectionHtml = `
                        <div class="mb-4">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <h6 class="fw-bold text-info m-0">
                                    <i class="fa-solid fa-gamepad me-1"></i> ${platform} 
                                    <span class="badge bg-dark border border-secondary text-muted ms-1">${gamesList.length}</span>
                                </h6>
                            </div>
                            <div class="horizontal-scroll-container">
                    `;

                    gamesList.forEach((game) => {
                        sectionHtml += `
                            <div class="game-item-card">
                                <button class="btn btn-sm btn-danger rounded-circle delete-btn game-item-delete" data-id="${game.id}" title="Supprimer">
                                    <i class="fa-solid fa-trash fa-xs"></i>
                                </button>
                                <img src="${game.imageUrl || 'https://via.placeholder.com/150'}" class="game-item-img" alt="Cover" onerror="this.src='https://via.placeholder.com/150'">
                                <div class="game-item-title" title="${game.title}">${game.title}</div>
                                <div class="game-item-size"><i class="fa-solid fa-hard-drive me-1"></i>${game.size || 'N/A'}</div>
                            </div>
                        `;
                    });

                    sectionHtml += `
                            </div>
                        </div>
                    `;

                    adminGamesContainer.innerHTML += sectionHtml;
                });

                // Attacher les événements de suppression
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const docId = e.currentTarget.getAttribute('data-id');
                        if (confirm("Supprimer ce jeu du Store ?")) {
                            await deleteDoc(doc(db, "games", docId));
                        }
                    });
                });
            });
        }

        // CHARGEMENT CHAT & AVIS
        function loadAdminChat() {
            const reviewsRef = collection(db, "gameComments");
            onSnapshot(reviewsRef, (snapshot) => {
                cachedComments = [];
                let unreadCount = 0;

                snapshot.forEach(docSnap => {
                    const c = { id: docSnap.id, ...docSnap.data() };
                    cachedComments.push(c);

                    if (!c.readByAdmin && c.username !== "Admin (Dr las)") {
                        unreadCount++;
                    }
                });

                const badgeNav = document.getElementById('unreadBadgeNav');
                if (unreadCount > 0) {
                    badgeNav.textContent = unreadCount;
                    badgeNav.classList.remove('d-none');
                } else {
                    badgeNav.classList.add('d-none');
                }

                renderAdminChat();
            });
        }

        function renderAdminChat() {
            const container = document.getElementById('adminChatContainer');
            container.innerHTML = "";

            let displayComments = cachedComments;

            if (currentChatFilter === 'unread') {
                displayComments = cachedComments.filter(c => !c.readByAdmin && c.username !== "Admin (Dr las)");
            }

            if (displayComments.length === 0) {
                container.innerHTML = `<p class="text-center text-muted py-4">Aucun commentaire dans cette liste.</p>`;
                return;
            }

            displayComments.forEach(comm => {
                container.innerHTML += `
                    <div class="card bg-dark border-secondary p-3 mb-2 rounded-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="text-info"><i class="fa-solid fa-user me-1"></i>${comm.username || 'Joueur'}</strong>
                            <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="deleteCommentAdmin('${comm.id}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <p class="mb-0 text-light small">${comm.text || comm.message}</p>
                    </div>
                `;
            });
        }

        window.deleteCommentAdmin = async function(commentId) {
            if (confirm("Supprimer cet avis ?")) {
                await deleteDoc(doc(db, "gameComments", commentId));
            }
        };
    </script>
</body>
</html>
